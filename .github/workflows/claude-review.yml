name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request following .claude/agents/pr-reviewer.md.

            Read the spec and plan for this feature under docs/specs/ and docs/plans/
            if they exist, and check the diff against the acceptance criteria and the
            Out of scope list.

            Priorities: OrganizationId scoping on every tenant query, role enforcement,
            module boundary violations, secrets in tracked files, async and nullable
            correctness, and tests that would still pass if the change were reverted.

            Post a summary with `gh pr comment` and use
            mcp__github_inline_comment__create_inline_comment for specific lines.
            Do not edit any files.
          claude_args: |
            --agent pr-reviewer
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
