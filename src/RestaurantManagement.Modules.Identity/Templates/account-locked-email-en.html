<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in paused</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f2;">
<tr>
<td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:100%; background-color:#ffffff;">
    <tr>
      <td style="padding:36px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:26px; line-height:34px; font-weight:bold; color:#221f1f;">
        Sign-in to your account is paused
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:26px; color:#333;">
        Hi {{NAME}}, someone tried to sign in to your account several times with a wrong password.
        Sign-in is paused for {{MINUTES}} minutes.
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 36px 32px; font-family:Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#555;">
        If it was not you, reset your password.
      </td>
    </tr>
  </table>
</td>
</tr>
</table>
</body>
</html>
