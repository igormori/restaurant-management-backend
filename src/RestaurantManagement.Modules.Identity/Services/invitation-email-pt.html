<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Você foi convidado</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f2;">
<tr>
<td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:100%; background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:36px 32px 0 32px;">
        <span style="font-family:Helvetica,Arial,sans-serif; font-size:26px; font-weight:bold; letter-spacing:3px; color:#CE2B37;">{{PRODUCT}}</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:26px; line-height:34px; font-weight:bold; color:#221f1f;">
        Você foi convidado para {{ORGANIZATION}}
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:26px; color:#333333;">
        {{INVITER}} convidou você para participar de {{ORGANIZATION}} no {{PRODUCT}}.
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:26px; color:#333333;">
        Você terá acesso como:
        <ul style="margin:8px 0 0 0; padding-left:20px;">{{ROLES}}</ul>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:28px 32px 0 32px;">
        <a href="{{LINK}}" style="display:inline-block; padding:14px 32px; background-color:#CE2B37; color:#ffffff; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:bold; text-decoration:none;">Aceitar o convite</a>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 0 32px; font-family:Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#555555;">
        Este convite expira em {{EXPIRY}}.
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 36px 32px; font-family:Helvetica,Arial,sans-serif; font-size:13px; line-height:20px; color:#8c8c8c;">
        Se você não esperava este convite, ignore este email e nada acontecerá.
      </td>
    </tr>
  </table>
</td>
</tr>
</table>
</body>
</html>
